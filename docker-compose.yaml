---
services:
  christelmusic-nl:
    build:
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      - SKIP_LOAD_DOTENV_FILE=1
    volumes:
      - ./app:/var/www/html:delegated
    ports:
      - '8081:80'

  composer-build:
    build:
      dockerfile: Dockerfile
      target: builder
    environment:
      - SKIP_LOAD_DOTENV_FILE=1
    volumes:
      - ./app:/var/www/html:delegated
    command:
      - /bin/sh
      - -c
      - |
        composer install
        /var/www/html/scripts/christelmusic warmup
